spring.application.name=Document Scan

spring.ai.openai.api-key=${grok-api-key}
openapi.url=https://api.groq.com/openai/v1/chat/completions

server.port=8081

# OCR Configuration
#tessdata is external tool needs to be installed separately and that path is to set below
app.tesseract.datapath=C:\\Program Files\\tes\\tessdata
app.ocr.default-language=eng
app.ocr.supported-languages=eng,fra,deu,spa,ita,por

# File upload settings for OCR
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# OCR processing settings
app.ocr.max-image-width=3000
app.ocr.max-image-height=3000
app.ocr.preprocess-images=true


spring.datasource.url=jdbc:postgresql://localhost:5432/documentScan
spring.datasource.username=${db-user}
spring.datasource.password=${db-password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${user-email}
spring.mail.password=${user-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



